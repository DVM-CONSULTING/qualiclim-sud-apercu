# Fabriqué par outils/fabriquer.mjs (mode aperçu) — ne pas modifier à la main.
# Posé par outils/installer-vps.sh dans /etc/nginx/sites-available/qualiclimsud.fr (certificat Let's Encrypt par certbot, méthode webroot).

# Port 80 : validation du certificat, puis tout part en HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name qualiclimsud.fr www.qualiclimsud.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme-qualiclimsud; default_type text/plain; }
    location / { return 301 https://qualiclimsud.fr$request_uri; }
}

# www renvoie vers l'adresse unique qualiclimsud.fr
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qualiclimsud.fr;
    ssl_certificate /etc/letsencrypt/live/qualiclimsud.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qualiclimsud.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://qualiclimsud.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qualiclimsud.fr;
    ssl_certificate /etc/letsencrypt/live/qualiclimsud.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qualiclimsud.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/qualiclimsud;
    index index.html;
    charset utf-8;

    # Aperçu : protégé par mot de passe et jamais indexé (STANDARD-SITE.md, SEO-INDEX-02)
    auth_basic "Apercu Qualiclim Sud";
    auth_basic_user_file /etc/nginx/qualiclimsud.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # En-têtes de sécurité (STANDARD-SITE.md §3)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml application/xml;

    # Les coulisses du dépôt ne sont jamais servies
    location ~ (^/\.|^/outils/|^/contenus/|^/configuration\.json$|^/_headers$|\.md$|\.mjs$) { return 404; }

    # Vraie page introuvable, avec le statut 404 (FUNC-404-01)
    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* ^/(polices|js/vendor)/ { expires 1y; try_files $uri =404; }
    location ~* \.(webp|jpg|png|ico|mp4|webm)$ { expires 30d; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
