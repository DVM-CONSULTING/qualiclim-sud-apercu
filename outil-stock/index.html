}
function funnelChart(deps) {
  const rows = STAGES.map(st => { const L = S.aff.filter(a => a.stage === st.k && deps.includes(a.depot) && (on('demandes') || a.source !== 'site')); return {st, n: L.length, m: L.reduce((s, a) => s + (a.montant || 0), 0)}; });
  const max = Math.max(...rows.map(r => r.n), 1);
  return `<div class="funnel" role="list">${rows.map((r, i) => `<button class="frow" role="listitem" data-go="affaires" title="${r.st.col} : ${r.n} affaire(s)${r.m && showPrices() ? ', ' + eur(r.m) + ' HT' : ''}">
    <span class="f-l">${r.st.col}</span>
    <span class="f-track"><i style="width:${Math.max(r.n / max * 100, r.n ? 6 : 0)}%"></i></span>
    <span class="f-v"><b class="num">${r.n}</b>${r.m && showPrices() ? `<span class="num">${nf.format(Math.round(r.m / 100) / 10)} k€</span>` : ''}</span>
  </button>`).join('')}</div>`;
}
function donutChart() {
  let vals = Object.keys(DEPOTS).map(d => ({d, n: DEPOTS[d], v: stockValue(d)})).sort((a, b) => b.v - a.v);
  if (vals.length > 3) vals = [vals[0], vals[1], {d:'_o', n:'Autres dépôts', v: vals.slice(2).reduce((s2, x) => s2 + x.v, 0)}];
  const tot = vals.reduce((s2, x) => s2 + x.v, 0) || 1, R = 52, C = 2 * Math.PI * R, gap = vals.length > 1 ? 3 : 0; let off = 0;
  const segs = vals.map((x, i) => { const len = x.v / tot * C; const sg = `<circle class="seg" cx="70" cy="70" r="${R}" fill="none" stroke="var(--c${i + 1})" stroke-width="16" stroke-dasharray="${Math.max(0, len - gap).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"><title>${esc(x.n)} : ${eur(x.v)} HT</title></circle>`; off += len; return sg; }).join('');
  return `<div class="donut"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Valeur du stock par dépôt">${segs}<text x="70" y="66" text-anchor="middle" class="d-t">${nf.format(Math.round(tot / 1000))} k€</text><text x="70" y="84" text-anchor="middle" class="d-s">au total</text></svg>
    <ul class="legend">${vals.map((x, i) => `<li><span class="sw" style="background:var(--c${i + 1})"></span><span>${esc(x.n)}</span><b class="num">${eur(x.v)}</b><span class="mute num">${Math.round(x.v / tot * 100)} %</span></li>`).join('')}</ul></div>`;
}
function areaChart(vals, labels) {
  const w = 640, h = 220, L = 44, Rr = 56, T = 14, B = 28, iw = w - L - Rr, ih = h - T - B;
  const top = scaleNice(Math.max(...vals) * 1.1), x = i => L + i * iw / (vals.length - 1), y = v => T + ih - v / top * ih;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const ticks = [0, top / 2, top];
  return `<div class="area" data-vals="${vals.join(',')}" data-labels="${labels.join(',')}">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Valeur des sorties par semaine, de ${nf.format(Math.round(Math.min(...vals)))} à ${nf.format(Math.round(Math.max(...vals)))} euros">
      ${ticks.map(t => `<line x1="${L}" x2="${w - Rr}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end" class="ax">${t ? nf.format(t / 1000) + ' k' : '0'}</text>`).join('')}
      ${labels.map((l, i) => i % 3 === 2 || i === labels.length - 1 ? `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" class="ax">${l}</text>` : '').join('')}
      <path class="ar" d="${d} L${x(vals.length - 1)} ${T + ih} L${L} ${T + ih} Z" fill="var(--c1)" opacity=".1"/>
      <path class="ln" d="${d}" pathLength="1" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${T + ih}" />
      <circle class="dot-end" cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="4.5" fill="var(--c1)" stroke="var(--raised)" stroke-width="2"/>
      <text x="${x(vals.length - 1) + 10}" y="${y(vals[vals.length - 1]) + 4}" class="endlbl">${nf1.format(vals[vals.length - 1] / 1000)} k€</text>
      <circle class="xd" r="4.5" cx="0" cy="0" style="opacity:0" fill="var(--c1)" stroke="var(--raised)" stroke-width="2"/>
      <rect class="hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg><div class="tip" hidden></div></div>`;
}
function fluideBars(flu) {
  const c = flu.reduce((s, f) => s + f.charge, 0), r = flu.reduce((s, f) => s + f.recup, 0), mx = Math.max(c, r, .1);
  return `<div class="fbars">${[['Chargé', c, 1], ['Récupéré', r, 2]].map(([l, v, k]) => `<div class="fb"><span class="fb-l"><span class="sw" style="background:var(--c${k})"></span>${l}</span><span class="fb-t"><i style="width:${v / mx * 100}%;background:var(--c${k})"></i></span><b class="num">${nf1.format(v)} kg</b></div>`).join('')}</div>`;
}
function wireArea(root) {
  root.querySelectorAll('.area').forEach(box => {
    const svg = box.querySelector('svg'), hit = box.querySelector('.hit'), tip = box.querySelector('.tip'), xh = box.querySelector('.xh'), xd = box.querySelector('.xd');
    const vals = box.dataset.vals.split(',').map(Number), labels = box.dataset.labels.split(',');
    const vb = svg.viewBox.baseVal, L = 44, iw = vb.width - L - 56, T = 14, ih = vb.height - 14 - 28, top = scaleNice(Math.max(...vals) * 1.1);
    const move = e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * vb.width;
      const i = Math.max(0, Math.min(vals.length - 1, Math.round((px - L) / iw * (vals.length - 1))));
      const cx = L + i * iw / (vals.length - 1), cy = T + ih - vals[i] / top * ih;
      xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.style.opacity = 1; xd.style.opacity = 1; xd.setAttribute('cx', cx); xd.setAttribute('cy', cy);
      tip.hidden = false; tip.innerHTML = `<span class="mute">Semaine du ${labels[i]}</span><b class="num">${eur(vals[i])}</b>`;
      const tx = cx / vb.width * r.width, ty = cy / vb.height * r.height;
      tip.style.left = Math.min(r.width - 150, Math.max(0, tx - 70)) + 'px'; tip.style.top = Math.max(0, ty - 64) + 'px';
    };
    const leave = () => { tip.hidden = true; xh.style.opacity = 0; xd.style.opacity = 0; };
    hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move); hit.addEventListener('pointerleave', leave);
  });
}
function animateCharts(v) {
  if (RM) return;
  v.querySelectorAll('.spark .ln, .area .ln').forEach((el, i) => anim(el, [{strokeDasharray: '1 1', strokeDashoffset: 1}, {strokeDasharray: '1 1', strokeDashoffset: 0}], {duration: 1200, delay: 250 + i * 90, easing: 'cubic-bezier(.6,0,.2,1)'}));
  v.querySelectorAll('.spark .ar, .area .ar').forEach((el, i) => anim(el, [{opacity: 0}, {opacity: .1}], {duration: 900, delay: 700 + i * 90, easing: OUT}));
  v.querySelectorAll('.dot-end').forEach((el, i) => anim(el, [{transform: 'scale(0)', transformOrigin: `${el.getAttribute('cx')}px ${el.getAttribute('cy')}px`}, {transform: 'scale(1)', transformOrigin: `${el.getAttribute('cx')}px ${el.getAttribute('cy')}px`}], {duration: 500, delay: 1300 + i * 90, easing: SPRING}));
  v.querySelectorAll('.endlbl').forEach(el => anim(el, [{opacity: 0}, {opacity: 1}], {duration: 400, delay: 1500, easing: OUT}));
  v.querySelectorAll('.f-track i, .fb-t i').forEach((el, i) => anim(el, [{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], {duration: 900, delay: 300 + i * 90, easing: SPRING}));
  v.querySelectorAll('.donut .seg').forEach((el, i) => { const fin = el.getAttribute('stroke-dasharray'); anim(el, [{strokeDasharray: `0 ${fin.split(' ')[1]}`}, {strokeDasharray: fin}], {duration: 1100, delay: 350 + i * 250, easing: 'cubic-bezier(.6,0,.2,1)'}); });
  v.querySelectorAll('.kpi2').forEach((el, i) => anim(el, [{opacity: 0, transform: 'translateY(12px)'}, {opacity: 1, transform: 'none'}], {duration: 560, delay: 80 + i * 70, easing: SPRING}));
}

function syncDepots() {
  Object.keys(DEPOTS).forEach(k => delete DEPOTS[k]);
  Object.entries(S.depotInfo).forEach(([k, d]) => DEPOTS[k] = d.nom);
  if (!DEPOTS[UI.depot]) UI.depot = Object.keys(DEPOTS)[0];
  for (const a of ARTICLES) for (const k of Object.keys(DEPOTS)) {
    if (S.stock[a.id] && S.stock[a.id][k] == null) S.stock[a.id][k] = 0;
    if (S.enCommande[a.id] && S.enCommande[a.id][k] == null) S.enCommande[a.id][k] = 0;
    if (a.seuil && a.seuil[k] == null) a.seuil[k] = 0;
  }
  const sf = document.getElementById('sideFoot'); if (sf) sf.textContent = `Dépôt${Object.keys(DEPOTS).length > 1 ? 's' : ''} : ${Object.values(DEPOTS).join(' · ')}`;
}
function mergeDepot(from, to) {
  for (const a of ARTICLES) {
    S.stock[a.id][to] = (S.stock[a.id][to] || 0) + (S.stock[a.id][from] || 0); delete S.stock[a.id][from];
    if (a.seuil) { a.seuil[to] = Math.max(a.seuil[to] || 0, a.seuil[from] || 0); delete a.seuil[from]; }
    if (S.enCommande[a.id]) { S.enCommande[a.id][to] = (S.enCommande[a.id][to] || 0) + (S.enCommande[a.id][from] || 0); delete S.enCommande[a.id][from]; }
  }
  S.series.forEach(s => { if (s.depot === from) s.depot = to; });
  S.aff.forEach(a => { if (a.depot === from) a.depot = to; });
  S.mvts = S.mvts.filter(m => !(m.type === 'transfert' && (m.depot === from || m.vers === from)));
  S.mvts.forEach(m => { if (m.depot === from) m.depot = to; if (/Nice/.test(m.user)) m.user = 'Responsable Fréjus'; });
  S.bouteilles.forEach(b => { if (b.depot === from) b.depot = to; });
  S.fluOps.forEach(f => { if (f.depot === from) f.depot = to; });
  S.aff.forEach(a => a.notes.forEach(n => { if (/Nice/.test(n.user)) n.user = 'Accueil Fréjus'; }));
}
const otherDepot = d => Object.keys(DEPOTS).find(k => k !== d) || null;
function depotLoad(code) {
  const stock = ARTICLES.reduce((s, a) => s + (S.stock[a.id][code] || 0), 0);
  const val = ARTICLES.reduce((s, a) => s + (S.stock[a.id][code] || 0) * a.prix, 0);
  const affs = S.aff.filter(a => a.depot === code && !['pose', 'perdu'].includes(a.stage));
  const bt = S.bouteilles.filter(b => b.depot === code);
  return {stock, val, affs, bt, refs: ARTICLES.filter(a => (S.stock[a.id][code] || 0) > 0).length};
}

function deleteDepot(code) {
  if (Object.keys(DEPOTS).length < 2) return toast('Il faut au moins un dépôt.');
  const L = depotLoad(code), d = S.depotInfo[code];

  const t = toTrash({kind:'depot', obj:{code, info: d, seuils}, label:`Dépôt ${d.nom}`});

function transferAll(from, to) {
  const now = new Date();
  for (const a of ARTICLES) { const q = S.stock[a.id][from] || 0; if (!q) continue; S.stock[a.id][from] = 0; S.stock[a.id][to] = (S.stock[a.id][to] || 0) + q; S.mvts.unshift({id: 'M' + (S.mvts.length + 1), date: now, user: who(), type:'transfert', art: a.id, qte: q, depot: from, vers: to, motif: 'Fermeture du dépôt'}); }
  S.series.forEach(s => { if (s.depot === from) s.depot = to; });
  S.aff.forEach(a => { if (a.depot === from && !['pose', 'perdu'].includes(a.stage)) { a.depot = to; addNote(a, `Dépôt changé : ${DEPOTS[from]} → ${DEPOTS[to]} (fermeture).`); } });
  S.bouteilles.forEach(b => { if (b.depot === from) b.depot = to; });
  log('action', 'stock', `Tout le contenu de « ${DEPOTS[from]} » transféré vers « ${DEPOTS[to]} »`);
  deleteDepot(from);
}

/* ---------- Sauvegardes (réelles dans le prototype : copies de l'état sur cet appareil) ---------- */
const SNAP_KEY = 'qs-snaps-v6';
const stateJSON = () => JSON.stringify({S, CLIENTS, ARTICLES, done: UI.done, seen: UI.seen, tourSeen: UI.tourSeen, affSeq, mods: UI.mods, big: UI.big, calm: UI.calm, theme: UI.theme, maint: UI.maint});
function snaps() { try { return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); } catch (e) { return []; } }
function snapNow(kind) {
  let L = snaps(); const data = stateJSON();
  L.unshift({id: 's' + Date.now(), t: Date.now(), kind, size: data.length, data});
  const keep = {manuelle: 3, quotidienne: 7, hebdomadaire: 4}, seen = {};
  L = L.filter(s => (seen[s.kind] = (seen[s.kind] || 0) + 1) <= keep[s.kind]);
  for (let tries = 0; tries < 6; tries++) { try { localStorage.setItem(SNAP_KEY, JSON.stringify(L)); break; } catch (e) { const i = L.map(s => s.kind).lastIndexOf('quotidienne'); if (i < 0) L.pop(); else L.splice(i, 1); } }
  log('backup', 'sauvegarde', `Sauvegarde ${kind} créée (${nf.format(Math.round(data.length / 1024))} Ko)`);
}
function autoSnap() {
  const L = snaps(), today = new Date().toDateString();
  if (L.some(s => s.kind !== 'manuelle' && new Date(s.t).toDateString() === today)) return;
  const lastW = L.find(s => s.kind === 'hebdomadaire');
  snapNow(!lastW || Date.now() - lastW.t > 7 * DAY - 36e5 ? 'hebdomadaire' : 'quotidienne');
}
function restoreSnap(id) {
  const s = snaps().find(x => x.id === id); if (!s) return;
  snapNow('manuelle');
  try { localStorage.setItem(SAVE_KEY, s.data); } catch (e) { return toast('Restauration impossible : espace de stockage plein.'); }
  log('backup', 'restauration', `Restauration de la sauvegarde du ${new Date(s.t).toLocaleString('fr-FR')}`);
  setTimeout(() => location.reload(), 300);
}

const scenesOn = () => SCENES.filter(s => !s.need || on(s.need));
const PL = {k: null, el: 0, last: 0, fired: 0, paused: false, raf: 0};
function scenePlay(k, restart) {
  const sc = SCENES.find(s => s.k === k) || scenesOn()[0]; UI.chap = sc.k;
  const st = document.getElementById('scStage'); if (!st) return;
  cancelAnimationFrame(PL.raf);
  st.innerHTML = sc.html + CUR;
  document.querySelectorAll('.chap').forEach(b => b.setAttribute('aria-current', b.dataset.chap === sc.k));
  const capsBox = document.getElementById('scCaps');
  capsBox.innerHTML = sc.caps.map((c, i) => `<li data-ci="${i}"><span class="num">${i + 1}</span>${c}</li>`).join('');
  document.getElementById('scTitle').textContent = sc.t;
  Object.assign(PL, {k: sc.k, el: 0, last: performance.now(), fired: 0, paused: false, sc, st});
  document.getElementById('scPlay').innerHTML = ic('pause', 18);
  if (RM) { sc.tl.forEach(([, fn]) => fn(st)); capsBox.querySelectorAll('li').forEach(l => l.classList.add('on')); markSeen(sc.k); return; }
  const tick = now => {
    if (!st.isConnected || PL.k !== sc.k) return;
    if (!PL.paused) {
      PL.el += now - PL.last;
      while (PL.fired < sc.tl.length && sc.tl[PL.fired][0] <= PL.el) { try { sc.tl[PL.fired][1](st); } catch (e) {} PL.fired++; }
      const ci = sc.capAt.filter(a => a <= PL.el).length - 1;
      capsBox.querySelectorAll('li').forEach((l, i) => { l.classList.toggle('on', i === ci); l.classList.toggle('past', i < ci); });
      const bar = document.getElementById('scBar'); if (bar) bar.style.width = Math.min(100, PL.el / sc.dur * 100) + '%';
      if (PL.el >= sc.dur + 900) { markSeen(sc.k); return scenePlay(sc.k, true); }
    }
    PL.last = now; PL.raf = requestAnimationFrame(tick);
  };
  PL.raf = requestAnimationFrame(tick);
}
function markSeen(k) {

  const m = document.getElementById('chapMeter'); if (m) { const L = scenesOn(); m.style.width = L.filter(s => UI.seen[s.k]).length / L.length * 100 + '%'; }
}

  PL.paused = !PL.paused;

}
