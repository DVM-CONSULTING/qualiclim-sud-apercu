<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Qualiclim Stock</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : registre clair à filets (ledger), barre latérale nuit cobalt, bandes cuivre / glacier,
   chiffres en Azeret Mono cobalt. Téléphone : barre d'onglets en bas, bouton Scanner au centre. */
:root{
  --paper:#f4f2ee;      /* argent clair : fond */
  --raised:#fbfaf8;     /* surface posée sur le fond */
  --ink:#0e1d33;        /* nuit cobalt : texte, filets forts, barre latérale */
  --ink-2:#4a5568;      /* texte secondaire */
  --ink-3:#7a8394;      /* libellés discrets */
  --line:rgba(14,29,51,.13);
  --line-strong:rgba(14,29,51,.85);
  --copper:#f2e1cb;     /* cuivre clair : bande */
  --glacier:#d8e4f2;    /* bleu glacier : bande */
  --cobalt:#2a5fae;     /* réservé aux chiffres */
  --side-bg:#0e1d33; --side-fg:#f4f2ee; --side-mute:rgba(244,242,238,.58); --side-hi:rgba(244,242,238,.10);
  --ok:#2d7a57; --ok-bg:#dcefe4;
  --warn:#9a5b00; --warn-bg:#f8e7c8;
  --crit:#b1281f; --crit-bg:#f7dcd8;
  --info-bg:#e3eaf5;
  --scrim:rgba(14,29,51,.42);
  --f-ui:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-num:"Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-card:10px; --r-pill:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0b1626; --raised:#122136; --ink:#eef0f3; --ink-2:#b5bdca; --ink-3:#8590a2;
    --line:rgba(238,240,243,.12); --line-strong:rgba(238,240,243,.7);
    --copper:#3a2e22; --glacier:#1b2c45; --cobalt:#8db1ec;
    --side-bg:#07101d; --side-fg:#eef0f3; --side-mute:rgba(238,240,243,.55); --side-hi:rgba(238,240,243,.08);
    --ok:#7fd1a8; --ok-bg:#163527; --warn:#f0bd6a; --warn-bg:#3a2a10; --crit:#f2958c; --crit-bg:#3f1a17; --info-bg:#1a2a42;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0b1626; --raised:#122136; --ink:#eef0f3; --ink-2:#b5bdca; --ink-3:#8590a2;
  --line:rgba(238,240,243,.12); --line-strong:rgba(238,240,243,.7);
  --copper:#3a2e22; --glacier:#1b2c45; --cobalt:#8db1ec;
  --side-bg:#07101d; --side-fg:#eef0f3; --side-mute:rgba(238,240,243,.55); --side-hi:rgba(238,240,243,.08);
  --ok:#7fd1a8; --ok-bg:#163527; --warn:#f0bd6a; --warn-bg:#3a2a10; --crit:#f2958c; --crit-bg:#3f1a17; --info-bg:#1a2a42;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.c-num{color:var(--cobalt)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mute{color:var(--ink-2)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}

/* ---------- Bandeau démonstration ---------- */
.demo{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding:7px 16px;background:var(--copper);color:var(--ink);font-size:12.5px;font-weight:600;text-align:center}
.demo .num{font-size:11px;opacity:.8}

/* ---------- Coquille ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 34px)}
.side{background:var(--side-bg);color:var(--side-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;font-weight:700}
.brand span{display:block;font-size:11px;color:var(--side-mute);letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{color:var(--side-mute);padding:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--side-fg);text-align:left;font-weight:500;opacity:.82}
.nav button:hover{background:var(--side-hi);opacity:1}
.nav button[aria-current="page"]{background:var(--side-hi);opacity:1;font-weight:700}
.nav .count{margin-left:auto;font-family:var(--f-num);font-size:11px;padding:1px 7px;border-radius:10px;background:var(--side-hi)}
.nav .count.alert{background:var(--crit);color:#fff}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--side-mute);padding:0 8px;line-height:1.5}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 32px 0}
.top h1{font-size:30px;font-weight:600;line-height:1.1}
.top .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.top .grow{flex:1 1 auto}
.roles{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--raised)}
.roles button{border:0;background:transparent;padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.roles button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
.content{padding:22px 32px 48px;display:flex;flex-direction:column;gap:26px;min-width:0}

/* ---------- Boutons, pastilles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:var(--r-pill);border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.soft{background:var(--raised);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--info-bg);color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.plain::before{display:none}
.tag{display:inline-block;font-family:var(--f-num);font-size:10.5px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);white-space:nowrap}
.fict{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}

/* ---------- Bandes du tableau de bord ---------- */
.band{border-radius:var(--r-card);padding:22px 24px;display:grid;gap:18px}
.band.copper{background:var(--copper)}
.band.glacier{background:var(--glacier)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.kpi{padding:2px 20px 4px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .v{font-family:var(--f-num);font-size:clamp(28px,3.4vw,46px);line-height:1;color:var(--cobalt);letter-spacing:-.04em;margin:8px 0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-family:var(--f-ui);font-size:.42em;font-weight:600;letter-spacing:0;margin-left:4px;color:var(--ink-2)}
.kpi .d{font-size:12.5px;color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line-strong)}
.sec-h h2{font-size:17px;font-weight:700}
.sec-h .act{font-size:12.5px;font-weight:600;color:var(--ink);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

/* ---------- Registre (tableaux à filets) ---------- */
.ledger-wrap{overflow-x:auto;min-width:0}
table.ledger{width:100%;border-collapse:collapse;font-size:13.5px}
.ledger th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
.ledger td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger th:first-child,.ledger td:first-child{padding-left:0}
.ledger th:last-child,.ledger td:last-child{padding-right:0}
.ledger td.r,.ledger th.r{text-align:right}
.ledger tbody tr[data-open]{cursor:pointer}
.ledger tbody tr[data-open]:hover td{background:color-mix(in srgb, var(--glacier) 45%, transparent)}
.art-name{font-weight:600;display:block}
.art-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.qty{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--cobalt);font-size:14px}
.qty.zero{color:var(--crit)}
.res{font-family:var(--f-num);font-size:11px;color:var(--ink-3);display:block}
[data-m]{display:none}

/* jauge stock : disponible / réservé / seuil */
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);width:100%;min-width:90px;overflow:visible}
.gauge i{position:absolute;top:0;bottom:0;left:0;border-radius:3px;background:var(--ink)}
.gauge i.res{background:repeating-linear-gradient(135deg,var(--ink-3) 0 3px,transparent 3px 6px);opacity:.9}
.gauge b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}

/* ---------- Filtres ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--raised);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:16px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glacier);color:var(--ink)}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-strong);padding:6px 2px;min-width:0}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0}
select.f{border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 12px;background:var(--raised)}

/* ---------- Listes simples ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
button.row:hover{background:color-mix(in srgb, var(--glacier) 40%, transparent)}
.date-chip{width:48px;text-align:center;border:1px solid var(--line-strong);border-radius:8px;padding:4px 0;line-height:1.1}
.date-chip b{display:block;font-family:var(--f-num);font-size:18px;font-weight:500;color:var(--cobalt)}
.date-chip span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.row .t{font-weight:600}
.row .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.mv-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glacier);color:var(--ink)}
.mv-ic.out{background:var(--copper)}

/* graphique barres */
.bars{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:stretch}
.bars .yax{white-space:nowrap;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-num);font-size:10px;color:var(--ink-3);text-align:right;padding-bottom:18px}
.bars .plot{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-bottom:18px;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% calc((100% - 18px)/2)}
.bars .col{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.bars .col i{display:block;background:var(--ink);border-radius:3px 3px 0 0;min-height:2px}
.bars .col:last-child i{background:var(--cobalt)}
.bars .col span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-family:var(--f-num);font-size:9.5px;color:var(--ink-3)}
.bars .col em{position:absolute;left:0;right:0;text-align:center;font-style:normal;font-family:var(--f-num);font-size:10.5px;color:var(--cobalt)}

/* cartes de données (cliquables uniquement) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r-card);background:var(--raised);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
button.card:hover{border-color:var(--line-strong)}
.card h3{font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.todo{color:var(--warn);font-weight:600}

/* ---------- Panneau latéral (fiche) et feuille d'action ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;overflow:auto;border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;background:var(--paper);padding:20px 24px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line-strong);display:flex;gap:12px;align-items:flex-start;z-index:2}
.drawer-h h2{font-size:21px;font-weight:700;line-height:1.2}
.drawer-b{padding:20px 24px 40px;display:flex;flex-direction:column;gap:24px}
.depots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.depot-box{border-radius:var(--r-card);padding:14px 16px;background:var(--glacier)}
.depot-box:nth-child(2){background:var(--copper)}
.depot-box .big{font-family:var(--f-num);font-size:36px;line-height:1;color:var(--cobalt);margin:8px 0 4px;letter-spacing:-.04em}
.serials{display:flex;flex-wrap:wrap;gap:6px}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line-strong);background:transparent;padding:9px 2px;font-size:15px;border-radius:0;min-width:0;width:100%}
.field select{background:var(--paper)}
.field .help{font-size:12px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line-strong);border-radius:var(--r-pill);width:max-content}
.stepper button{width:46px;height:44px;border:0;background:transparent;font-size:20px}
.stepper input{width:64px;text-align:center;border:0;background:transparent;font-family:var(--f-num);font-size:18px;color:var(--cobalt)}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.types button{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 6px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.types button[aria-pressed="true"]{border-color:var(--ink);background:var(--glacier)}
.checks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.check{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px}
.note.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--r-pill);font-weight:600;font-size:13.5px;z-index:60;box-shadow:0 8px 24px rgba(14,29,51,.25);max-width:calc(100% - 32px);text-align:center}

/* ---------- Mode technicien ---------- */
.tech{max-width:460px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hello{display:flex;flex-direction:column;gap:2px}
.hello .lbl{color:var(--ink-2)}
.hello h2{font-size:26px;font-weight:600}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:0;border-radius:14px;padding:18px 16px;min-height:104px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;font-weight:700;font-size:16px;color:var(--ink);background:var(--glacier)}
.big.c2{background:var(--copper)}
.big.c3{background:var(--raised);border:1px solid var(--line)}
.big.scan{grid-column:1 / -1;background:var(--ink);color:var(--paper);min-height:84px;flex-direction:row;align-items:center;justify-content:flex-start;gap:16px;font-size:18px}
.big small{display:block;font-weight:500;font-size:12.5px;opacity:.75;margin-top:2px}
.job{border:1px solid var(--line);border-radius:var(--r-card);background:var(--raised);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.job-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.job ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.job li{display:flex;justify-content:space-between;gap:10px}

/* scanner simulé */
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:14px;background:#0a1220;overflow:hidden;display:grid;place-items:center}
.viewfinder .frame{width:72%;height:42%;border:2px solid rgba(244,242,238,.85);border-radius:12px;position:relative}
.viewfinder .laser{position:absolute;left:6%;right:6%;height:2px;background:#ff5a4a;top:50%;box-shadow:0 0 12px #ff5a4a;animation:scan 1.6s ease-in-out infinite alternate}
.viewfinder .bars-fake{position:absolute;inset:22% 14%;background:repeating-linear-gradient(90deg,rgba(244,242,238,.75) 0 2px,transparent 2px 5px,rgba(244,242,238,.75) 5px 6px,transparent 6px 10px);opacity:.25}
.viewfinder p{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(244,242,238,.8);font-size:12px;margin:0}
@keyframes scan{from{top:30%}to{top:70%}}

/* ---------- Barre d'onglets (téléphone) ---------- */
.tabbar{display:none}
@media (max-width: 860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:14px 16px 0}
  .top h1{font-size:24px}
  .roles{order:3;width:100%;justify-content:space-between}
  .roles button{flex:1}
  .content{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .kpis{grid-template-columns:1fr 1fr;gap:16px 0}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .split{grid-template-columns:minmax(0,1fr)}
  .band{padding:18px 16px}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--raised);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-2);padding:6px 0;min-height:52px}
  .tabbar button[aria-current="page"]{color:var(--ink)}

  .hide-m{display:none}
  [data-m]{display:inline}
  .drawer-h,.drawer-b{padding-left:16px;padding-right:16px}
  .types{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- v2 : affaires, à faire, échanges ---------- */
button.kpi{background:none;border:0;border-left:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:0}
button.kpi:first-child{border-left:0}
button.kpi:hover .lbl{color:var(--ink)}
.linkbtn{background:none;border:0;text-decoration:underline;text-underline-offset:3px;font-weight:600;padding:0;color:var(--ink)}
.pill.info{background:var(--info-bg);color:var(--cobalt)}
.todo-row{grid-template-columns:auto minmax(0,1fr) auto}
.todo-row .t .pill{margin-left:6px;vertical-align:1px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:-8px}
.tabs button{border:0;background:none;padding:8px 0 10px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.kcol{background:color-mix(in srgb, var(--glacier) 38%, var(--paper));border-radius:var(--r-card);padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-snap-align:start}
.kcol header{display:flex;justify-content:space-between;font-weight:700;font-size:13.5px;padding:0 4px}
.kcol header .num{color:var(--cobalt);font-weight:500}
.kc-sum{font-size:11.5px;color:var(--ink-2);padding:0 4px;margin-top:-4px}
.kc-list{display:flex;flex-direction:column;gap:8px}
.kcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-card);padding:11px 12px;color:inherit}
.kcard:hover{border-color:var(--line-strong)}
.kc-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.kc-name{font-weight:700;font-size:14px}
.kc-sub{font-size:12px;color:var(--ink-2)}
.kc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.stages{list-style:none;margin:14px 0 0;padding:0;display:flex;gap:4px;flex-wrap:wrap}
.stages li{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-3);padding-right:10px}
.stages li span{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-3)}
.stages li.done{color:var(--ink-2)} .stages li.done span{background:var(--ink-2);border-color:var(--ink-2)}
.stages li.now{color:var(--ink)} .stages li.now span{background:var(--cobalt);border-color:var(--cobalt);box-shadow:0 0 0 3px var(--info-bg)}
.next{background:var(--copper);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.next p{margin:0;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.noteform{display:flex;gap:8px;margin-top:12px;align-items:center}
.noteform input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line-strong);background:transparent;padding:8px 2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.timeline{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.timeline li.mute{display:block}
.timeline li .num{font-size:11.5px;color:var(--ink-3);padding-top:2px}
.stepper.sm{display:inline-flex;align-items:center}
.stepper.sm button{width:36px;height:36px;font-size:18px}
.stepper.sm .num{min-width:28px;text-align:center;font-size:16px}

@media (max-width: 860px){
  .kanban{grid-template-columns:repeat(5,82%);margin:0 -16px;padding:0 16px 6px;scroll-padding:16px}
  .todo-row{grid-template-columns:auto minmax(0,1fr)}
  .todo-row .btn{grid-column:2;justify-self:start}
  #depotSwitch{order:4;width:100%}
  #depotSwitch button{flex:1}

/* ---------- v3 : mouvement et finitions ---------- */
:root{--ease-out:cubic-bezier(.2,0,0,1)}
.btn,.iconbtn,.cmdk-btn,.seg button,.roles button,.tabs button,.kpi{transition:transform 90ms var(--ease-out),background-color 140ms var(--ease-out),color 140ms,box-shadow 180ms,border-color 140ms}
.btn:hover{box-shadow:0 6px 16px -8px rgba(14,29,51,.45)}
.btn:active,.iconbtn:active,.cmdk-btn:active,.seg button:active,.roles button:active{transform:scale(.97)}
.kcard,button.row,.card,.big,.job{transition:transform 180ms var(--ease-out),box-shadow 220ms var(--ease-out),border-color 140ms,background-color 140ms}
.kcard:hover,button.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(14,29,51,.5)}
.big:hover{transform:translateY(-2px)}
.big:active,.kcard:active{transform:scale(.98)}
.qty{display:inline-block;border-radius:4px}
.bars .col i{transform-origin:bottom}
.gauge i{transform-origin:left}
.gauge i,.bars .col i{transition:width 600ms var(--ease-out),height 600ms var(--ease-out)}
.thumb{position:absolute;z-index:0;pointer-events:none;border-radius:16px}
#roles,#depotSwitch,.nav{position:relative}
#roles>button,#depotSwitch>button,.nav>button,.nav>.lbl,#tabbar>button{position:relative;z-index:1}
#roles>.thumb{background:var(--ink)}
.roles button[aria-pressed="true"]{background:transparent;color:var(--paper)}
#depotSwitch>.thumb{background:var(--glacier)}
#depotSwitch button[aria-pressed="true"]{background:transparent}
.nav>.thumb{background:var(--side-hi);border-radius:8px}
.nav button[aria-current="page"]{background:transparent}
#tabbar>.thumb{background:var(--ink);border-radius:0 0 3px 3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;padding-bottom:14px;background:color-mix(in srgb,var(--paper) 84%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);transition:box-shadow 200ms}
.top.scrolled{box-shadow:0 1px 0 var(--line)}
.content{padding-top:12px}
.cmdk-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--raised);color:var(--ink-2);font-size:13px;font-weight:600}
.cmdk-btn:hover{border-color:var(--line-strong);color:var(--ink)}
kbd{font-family:var(--f-num);font-size:10.5px;padding:2px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--paper);color:var(--ink-2)}
.ck-scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.ck{position:fixed;z-index:71;left:50%;top:12vh;width:min(620px,calc(100% - 32px));margin-left:calc(min(620px,calc(100% - 32px)) / -2);background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 80px -20px rgba(14,29,51,.55);overflow:hidden;display:flex;flex-direction:column;max-height:72vh}
.ck-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.ck-in input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:17px;color:var(--ink)}
.ck-body{position:relative;overflow:auto;padding:6px 8px 8px}
.ck-hl{position:absolute;left:8px;right:8px;top:0;height:0;border-radius:9px;background:var(--glacier);pointer-events:none;opacity:0}
.ck-g{position:relative;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:12px 10px 4px}
.ck-item{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;color:inherit}
.ck-t{display:flex;flex-direction:column;min-width:0}
.ck-t b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-t span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-enter{opacity:0;color:var(--ink-2);font-family:var(--f-num);transition:opacity 120ms}
.ck-item[aria-selected="true"] .ck-enter{opacity:1}
.ck-empty{padding:22px 10px;margin:0;color:var(--ink-2)}
.ck-foot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.ck-foot kbd{margin-right:3px}
.toast{display:flex;align-items:center;gap:10px}
.toast .ck-ic{color:#7fd1a8;flex:none}
.viewfinder .frame{transition:border-color 160ms,transform 260ms var(--ease-out)}
.viewfinder.hit .frame{border-color:#4fd69c;transform:scale(1.06)}
.viewfinder.hit .laser{opacity:0}
.viewfinder.hit::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(79,214,156,.35),transparent 60%)}
@media (prefers-reduced-motion: no-preference){
  .toast .ck-ic path{stroke-dasharray:24;stroke-dashoffset:24;animation:qs-draw .45s .18s var(--ease-out) forwards}
  .stages li.now span{animation:qs-pulse 2.2s 1s ease-out infinite}
  .viewfinder.hit::after{animation:qs-flash .65s ease-out forwards}
  .scanbtn .ic{animation:qs-breathe 3.2s ease-in-out infinite}
  .pill.crit::before{animation:qs-blink 1.8s ease-in-out infinite}
}
@keyframes qs-draw{to{stroke-dashoffset:0}}
@keyframes qs-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--cobalt) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
@keyframes qs-flash{from{opacity:1}to{opacity:0}}
@keyframes qs-breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 30%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes qs-blink{0%,100%{opacity:.75}50%{opacity:.25}}
@media (max-width: 860px){
  .top{position:static;backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;padding-bottom:0}
  .cmdk-btn span,.cmdk-btn kbd{display:none}
  .cmdk-btn{width:36px;padding:0;justify-content:center}
  .ck{top:8vh}
  .ck-foot{display:none}
}

/* ---------- v3.1 : vrai logo du client ---------- */
.brand{flex-direction:column;align-items:flex-start;gap:6px;padding:4px 8px 0}

#splash:empty{display:none}
#splash .sp-wrap{position:relative;width:min(420px,72vw)}
#splash img{display:block;width:100%;height:auto}
#splash .sp-shine{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) -150% 0/250% 100% no-repeat}

/* ---------- v4 : fiches, corbeille, formation ---------- */
.three{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:14px}
.fsec{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.fsec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-bottom-color:var(--crit);background:color-mix(in srgb,var(--crit-bg) 45%,transparent)}
.ferr{font-size:12px;color:var(--crit);font-weight:600}
.findrow{display:flex;gap:8px;align-items:center}
.findrow input{flex:1}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;color:inherit}
.hit:hover{border-color:var(--line-strong)}
.hit span{font-size:12px;color:var(--ink-2)}
.attbox{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-radius:var(--r-card);padding:12px 14px;background:var(--raised);border:1px solid var(--line);font-size:13px}
.attbox.ok{background:var(--ok-bg);border-color:transparent}
.attbox.warn{background:var(--warn-bg);border-color:transparent}
.attbox.crit{background:var(--crit-bg);border-color:transparent}
.checkline{display:flex;gap:10px;align-items:center;font-size:14px}
.checkline input{width:20px;height:20px;accent-color:var(--ink)}
.kindseg{align-self:flex-start}
.kindseg button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px}
.danger-zone{border-top:1px dashed var(--line-strong);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.note.crit{background:var(--crit-bg);border-color:transparent;color:var(--ink)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;color:var(--ink-2);text-align:center}
.welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:var(--r-card);padding:14px 18px}
.welcome .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.welcome .btn.ghost{background:transparent;color:var(--paper);border-color:rgba(244,242,238,.4)}
.toast.has-act{pointer-events:auto}
.toast-act{margin-left:6px;border:0;background:rgba(244,242,238,.16);color:inherit;font-weight:700;padding:5px 12px;border-radius:14px}
.toast-act:hover{background:rgba(244,242,238,.28)}
.train{grid-template-columns:minmax(0,1fr) auto;align-items:center}
.train-h{font-size:clamp(22px,2.6vw,32px);font-weight:600;margin:6px 0 8px}
.train-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.meter{width:200px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.meter span{display:block;height:100%;background:var(--cobalt);border-radius:4px;transition:width .8s var(--ease-out)}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line-strong)}
.mission{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.m-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);font-family:var(--f-num);font-size:15px}
.mission.is-done .m-num{background:var(--ok);border-color:var(--ok);color:#fff}
.m-body h3{font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m-body ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.faq{display:flex;flex-direction:column}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}

.tour-catch{position:fixed;inset:0;z-index:89}
.tour-hole{position:fixed;z-index:90;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,16,30,.58);pointer-events:none;transition:left .45s var(--ease-out),top .45s var(--ease-out),width .45s var(--ease-out),height .45s var(--ease-out);outline:2px solid color-mix(in srgb,var(--cobalt) 70%,transparent);outline-offset:2px}
.tour-card{position:fixed;z-index:91;background:var(--paper);border-radius:14px;padding:18px;box-shadow:0 24px 60px -18px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px}

@media (max-width: 860px){

/* ---------- v5 : refonte visuelle (canevas froid, panneaux nets, graphiques) ---------- */
/* Panneaux blancs posés sur un fond argent froid : chaque bloc a un titre, une icône et une phrase « à quoi ça sert ». */
:root{--paper:#eef2f7;--raised:#ffffff;--ink:#0e1d33;--ink-2:#46546a;--ink-3:#748197;--line:rgba(14,29,51,.10);--line-strong:rgba(14,29,51,.55);--copper:#e6edf7;--glacier:#dde8f7;--c1:#2a5fae;--c2:#16936f;--chip:#e3ecf9;--warn:#9a5800;--warn-bg:#fcefd6;--shadow:0 1px 2px rgba(14,29,51,.06),0 12px 30px -18px rgba(14,29,51,.28);--canvas-hi:#f6f8fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0a1322;--raised:#111c2e;--ink:#eef2f7;--ink-2:#b4bfcf;--ink-3:#8492a8;--line:rgba(238,242,247,.10);--line-strong:rgba(238,242,247,.5);--copper:#16233a;--glacier:#1a2c48;--c1:#6a93e6;--c2:#1f9e78;--chip:#1b2b45;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);--canvas-hi:#0d1830;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0a1322;--raised:#111c2e;--ink:#eef2f7;--ink-2:#b4bfcf;--ink-3:#8492a8;--line:rgba(238,242,247,.10);--line-strong:rgba(238,242,247,.5);--copper:#16233a;--glacier:#1a2c48;--c1:#6a93e6;--c2:#1f9e78;--chip:#1b2b45;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);--canvas-hi:#0d1830;color-scheme:dark}
.demo{background:#0e1d33;color:#cfd9e8;font-weight:500;font-size:12px;padding:6px 16px}
.demo .num{opacity:.7}
.panel,.band,.content > section,.split > section,.content > .ledger-wrap{background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px}
.band{gap:16px}
.content > .ledger-wrap{padding:6px 20px 8px}
.content > .rows,.content > .missions{background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:4px 20px}
.content{gap:20px}
.sec-h{border-bottom:1px solid var(--line)}
.ledger th{border-bottom:1px solid var(--line)}
.ph{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:14px}
.ph h2{font-size:16px;font-weight:700;line-height:1.25}
.ph p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.ph .act{background:none;border:0;padding:4px 0;font-weight:600;font-size:12.5px;color:var(--c1);white-space:nowrap}
.chip{width:34px;height:34px;border-radius:10px;background:var(--chip);color:var(--c1);display:grid;place-items:center;flex:none}
.chip.crit{background:var(--crit-bg);color:var(--crit)} .chip.ok{background:var(--ok-bg);color:var(--ok)}

.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:140px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}

.fbars{display:flex;flex-direction:column;gap:16px;margin-top:4px}
.fb{display:grid;grid-template-columns:100px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13.5px}

.two-col{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.more-row{grid-template-columns:1fr;color:var(--c1)}
.next{background:var(--chip);border:1px solid color-mix(in srgb,var(--c1) 22%,transparent)}
.kcol{background:color-mix(in srgb,var(--chip) 55%,var(--paper));border:1px solid var(--line)}
.kcol header>span:first-child{display:flex;align-items:center;gap:8px}
.kcol header>span:first-child::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.kcol:nth-child(2) header>span:first-child::before{background:#c98a12}
.kcol:nth-child(3) header>span:first-child::before{background:var(--c1)}
.kcol:nth-child(4) header>span:first-child::before{background:#0e8f9a}
.kcol:nth-child(5) header>span:first-child::before{background:var(--ok)}
.kcard{box-shadow:0 1px 2px rgba(14,29,51,.06)}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.preset{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--raised);color:inherit;transition:border-color 160ms,background-color 160ms,transform 160ms}
button.preset:hover{border-color:var(--line-strong);transform:translateY(-1px)}

.pr-t{font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap} .pr-x{font-size:13px;color:var(--ink-2)} .pr-m{font-size:12px;color:var(--ink-3)}
.mods{display:flex;flex-direction:column}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}

.mod b{display:block;font-size:15px} .mod span{display:block;font-size:13px;color:var(--ink-2)} .mod em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:color-mix(in srgb,var(--ink) 22%,transparent);position:relative;cursor:pointer;transition:background-color 200ms;flex:none;margin:0}
.switch::before{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 260ms cubic-bezier(.34,1.4,.64,1)}
.switch:checked{background:var(--c1)} .switch:checked::before{transform:translateX(20px)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.smode{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--raised);color:inherit}
.smode.on{border-color:var(--c1);background:var(--chip);color:var(--ink)}
.smode b{font-size:15px} .smode span{font-size:12.5px;color:var(--ink-2)}
.vf-mode{position:absolute;top:12px;left:12px;background:rgba(244,242,238,.16);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px}
.scan-v .panel{padding:16px}
html.big .shell,html.big .drawer,html.big .tabbar,html.big .ck,html.big .tour-card{zoom:1.12}
@media (min-width: 861px) and (max-width: 1180px){

  .drawer .form > button[type=submit]{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:3;box-shadow:0 12px 26px -10px rgba(14,29,51,.55)}
  .panel,.band,.content > section,.split > section{padding:16px;border-radius:14px}
  .content > .ledger-wrap{padding:4px 14px}
  .kpi-row{grid-template-columns:1fr 1fr;gap:10px}

  .kpi2-f{flex-direction:column;align-items:stretch}
  .spark{width:100%;height:30px}
  .dash,.dash-b{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}

}
[hidden]{display:none!important}

/* ---------- v6 : dépôts, équipe, maintenance ---------- */
:root{--c3:#b26a1e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c3:#c7702a}}
:root[data-theme="dark"]{--c3:#c7702a}
.no-delete [data-delcl],.no-delete [data-delaff],.no-delete [data-delart],.no-delete [data-purge],.no-delete [data-deldepot]{display:none!important}
.roles{padding:0;border:0;background:none}
.rolepick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--raised);padding:4px 6px 4px 14px;font-size:12px;color:var(--ink-3);font-weight:600}
.rolepick select{border:0;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;padding:7px 12px;border-radius:16px;cursor:pointer}
.depot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.depot-lines{display:flex;flex-direction:column;gap:10px}
.dl{display:grid;grid-template-columns:minmax(0,1fr) 130px 130px;gap:12px;align-items:end;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.dl b{align-self:center}
.roles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.role-card{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;background:var(--chip)}
.role-card span{font-size:13px;color:var(--ink-2)}
.rolecards{display:flex;flex-direction:column;gap:8px}
.rolecard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--raised);color:inherit}
.rolecard.on{border-color:var(--c1);background:var(--chip)}
.rolecard span{font-size:12.5px;color:var(--ink-2)}
tr[data-user]{cursor:pointer}
tr[data-user]:hover td{background:color-mix(in srgb,var(--glacier) 45%,transparent)}
.health{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.htile{display:flex;flex-direction:column;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.htile b{font-size:20px} .htile .mute{font-size:12px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ok)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}
.live.paused{color:var(--ink-3)} .live.paused i{background:var(--ink-3)}
@media (prefers-reduced-motion: no-preference){.live:not(.paused) i{animation:qs-live 1.6s ease-out infinite}}
@keyframes qs-live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.log-list{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--canvas-hi)}
.log-day{position:sticky;top:0;z-index:1;background:var(--canvas-hi);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px 6px;border-bottom:1px solid var(--line)}
.log-row{display:grid;grid-template-columns:70px 92px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px}
.log-row.lv-error{background:color-mix(in srgb,var(--crit-bg) 55%,transparent)}
.log-t{font-size:11.5px;color:var(--ink-3)}
.log-m{min-width:0;overflow-wrap:anywhere} .log-m em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3)}
.log-w{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.maint-banner{display:flex;align-items:center;gap:10px;background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px 16px;font-weight:600}
@media (max-width: 860px){
  .health{grid-template-columns:1fr 1fr}
  .log-row{grid-template-columns:62px minmax(0,1fr);row-gap:4px}
  .log-row .pill{grid-column:2;justify-self:start}
  .log-row .log-m,.log-row .log-w{grid-column:2}

  .dl b{grid-column:1 / -1}
  .rolepick span{display:none}
  .rolepick{padding:4px;width:100%}
  .rolepick select{width:100%}

@media (max-width: 860px){
  .ph{grid-template-columns:auto minmax(0,1fr)}
  .ph > :nth-child(3){grid-column:1 / -1;justify-self:start}
  .row > .btnrow{grid-column:2;justify-self:start}

/* ---- v8 : formation animée ---- */
.train2{display:flex;flex-direction:column;gap:22px}
.tr-h{display:flex;gap:24px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.tr-prog{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tr-prog > div{display:grid;grid-template-columns:90px 160px auto;gap:10px;align-items:center}
.tr-prog .meter{width:160px}
.player{display:grid;grid-template-columns:260px minmax(0,800px);gap:22px;align-items:start}
.chaps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chap{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:10px;background:none;text-align:left;font-weight:600;color:var(--ink-2)}
.chap:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.chap[aria-current="true"]{background:var(--raised);border-color:var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(14,29,51,.08)}
.chap .cn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;border:1.5px solid var(--line-strong)}
.chap[aria-current="true"] .cn{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.chap.seen .cn{background:var(--ok);border-color:var(--ok);color:#fff}
.chap .cd{font-size:11px;color:var(--ink-3)}
.screen{display:flex;flex-direction:column;gap:14px;min-width:0}
.sc-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 10%,transparent) 1px,transparent 1.5px) 0 0/18px 18px,
  linear-gradient(160deg,var(--glacier),color-mix(in srgb,var(--glacier) 60%,var(--paper)))}
.sc-stage{position:relative;height:360px;padding:22px;display:flex;flex-direction:column;gap:12px;justify-content:safe center;font-size:13px;overflow:hidden;user-select:none}
.sc-bar{height:3px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.sc-bar i{display:block;height:100%;width:0;background:var(--cobalt)}
.sc-under{display:flex;flex-direction:column;gap:12px}
.sc-ctl{display:flex;gap:8px;align-items:center}
.sc-ctl h3{font-size:18px;margin-left:6px}
.sc-caps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sc-caps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-radius:10px;color:var(--ink-3);transition:background-color .3s,color .3s}
.sc-caps li .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid var(--line-strong)}
.sc-caps li.past{color:var(--ink-2)}
.sc-caps li.on{background:var(--info-bg);color:var(--ink);font-weight:600}
.sc-caps li.on .num{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.sc-hide{display:none!important}
.sc-cur{position:absolute;left:0;top:0;z-index:9;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transform:translate(36px,38px)}
.sc-rip{position:absolute;z-index:8;width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--cobalt) 45%,transparent);pointer-events:none}
/* maquettes */
.m-panel{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px -12px rgba(14,29,51,.35);display:flex;flex-direction:column;gap:8px;transition:box-shadow .4s}
.m-panel.glow{box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 35%,transparent)}
.m-h{font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.m-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.m-kpi{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative;overflow:hidden}
.m-kpi span{display:block;font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.m-kpi b{font-family:var(--f-num);font-size:20px;font-weight:500}
.m-kpi small{margin-left:3px;color:var(--ink-3)}
.m-spark{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c1);transform-origin:left;animation:mspark 1.6s var(--ease-out) both}
.m-kpi:nth-child(2) .m-spark{background:var(--crit)} .m-kpi:nth-child(3) .m-spark{background:var(--c2)} .m-kpi:nth-child(4) .m-spark{background:var(--c3)}
@keyframes mspark{from{transform:scaleX(0)}}
.m-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);transition:opacity .4s,transform .4s,max-height .5s,padding .5s;max-height:60px}
.m-row:first-of-type{border-top:0}
.m-row.pulse .m-ic{animation:mpulse 1.2s ease-out 2}
.m-row.done{background:var(--ok-bg);border-radius:8px}
.m-row.gone{opacity:0;transform:translateX(30px);max-height:0;padding:0 4px;overflow:hidden}
@keyframes mpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--cobalt) 25%,transparent)}}
.m-ic{width:22px;height:22px;border-radius:50%;background:var(--glacier);display:block}
.m-row span:not(.m-tag){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);border:1px solid var(--line-strong);font-size:12px;font-weight:700;white-space:nowrap;background:var(--raised)}
.m-btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.m-btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,transparent)}
.m-btn.m-big{padding:12px 16px;font-size:14px;width:100%}
.m-pill{display:inline-block;font-style:normal;padding:1px 8px;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;background:var(--info-bg);transition:background-color .3s}
.m-pill.warn{background:var(--warn-bg);color:var(--warn)} .m-pill.ok{background:var(--ok-bg);color:var(--ok)} .m-pill.info{background:var(--info-bg)}
.m-tag{font-family:var(--f-num);font-size:10px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);font-style:normal}
.m-kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;height:100%}
.m-col{background:color-mix(in srgb,var(--raised) 60%,transparent);border:1px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.m-colh{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.m-colh i{width:7px;height:7px;border-radius:50%;background:var(--c1)}
.c2 .m-colh i,.c3 .m-colh i{background:var(--c3)} .c4 .m-colh i{background:var(--c2)}
.m-card{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 2px rgba(14,29,51,.08);min-width:0}
.m-card span{font-size:11px;color:var(--ink-2)}
.m-card.ghost{opacity:.55}
.m-card .m-pill{align-self:flex-start}
.m-drawer{position:absolute;right:14px;top:14px;bottom:14px;width:46%;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:-16px 0 40px -20px rgba(14,29,51,.5);z-index:5}
.m-drawer p{margin:0;color:var(--ink-2)}
.m-form{max-width:440px;width:100%;align-self:center}
.m-seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--r-pill);align-self:flex-start}
.m-seg b{padding:4px 12px;border-radius:var(--r-pill);font-size:12px;transition:background-color .25s,color .25s}
.m-seg b.on{background:var(--ink);color:var(--paper)}
.m-field{display:flex;flex-direction:column;gap:3px;min-width:0}
.m-field > span{font-size:10.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.m-input{display:block;font-style:normal;min-height:30px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.m-hits{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:-4px}
.m-hit{padding:6px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column}
.m-hit:first-child{border-top:0;background:var(--info-bg)}
.m-hit span{font-size:10.5px;color:var(--ink-2);font-family:var(--f-num)}
.m-ademe{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn);transition:background-color .4s,color .4s}
.m-ademe .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:.5}
.m-ademe.checking .spin{border-right-color:transparent;opacity:1;animation:mspin .7s linear infinite}
.m-ademe.ok{background:var(--ok-bg);color:var(--ok)} .m-ademe.ok .spin{border:0;opacity:1;background:currentColor;mask:radial-gradient(circle,#000 35%,transparent 38%)}
@keyframes mspin{to{transform:rotate(360deg)}}
.m-form .save,.vform .vbtn{align-self:flex-start}
.m-srow{display:grid;grid-template-columns:minmax(0,1fr) auto 150px auto;gap:12px;align-items:center}
.m-srow > div:first-child b{display:block}
.m-q{font-family:var(--f-num);font-size:22px;font-weight:500}
.m-gauge{position:relative;height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 10%,transparent);transition:box-shadow .4s}
.m-gauge.focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--cobalt) 35%,transparent)}
.m-gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.m-gauge .gres{width:36%;background:repeating-linear-gradient(135deg,var(--c1) 0 3px,transparent 3px 6px);opacity:.55}
.m-gauge .gfill{width:24%;background:var(--c1)}
.m-gauge s{position:absolute;left:36%;top:-4px;bottom:-4px;width:2px;background:var(--crit);border-radius:1px}
.m-mini{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;background:var(--glacier);flex-wrap:wrap}
.m-step{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:var(--raised)}
.m-step b{width:34px;text-align:center;padding:4px 0;font-family:var(--f-num);font-size:14px}
.m-panel .add{align-self:flex-start}
.m-phone{width:236px;height:322px;margin:0 auto;border-radius:30px;border:6px solid #0e1d33;background:#0e1d33;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 40px -20px rgba(14,29,51,.6)}
.m-phone.light{background:var(--paper);padding:12px 10px;gap:8px;overflow:hidden}
.m-phone.light .m-btn.m-big{flex:none;margin-top:4px}
.m-vf{position:relative;flex:1;display:grid;place-items:center;background:radial-gradient(circle,#2b3d57,#0e1d33)}
.m-vf.hit{background:radial-gradient(circle,#2f6e57,#0e1d33)}
.m-code{width:120px;height:70px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 5px,transparent 5px 8px,#fff 8px 11px,transparent 11px 12px);border:8px solid #fff;border-radius:4px;transition:transform .5s}
.m-code.other{background:repeating-linear-gradient(90deg,#fff 0 3px,transparent 3px 5px,#fff 5px 6px,transparent 6px 9px);transform:rotate(-4deg)}
.m-laser{position:absolute;left:12%;right:12%;height:2px;top:50%;background:#ff5a4a;box-shadow:0 0 12px #ff5a4a;animation:scan 1.4s ease-in-out infinite alternate}
.m-vf.hit .m-laser{background:#52e0a4;box-shadow:0 0 14px #52e0a4;animation-play-state:paused}
.m-frame{position:absolute;inset:22% 14%;border:2px solid rgba(255,255,255,.6);border-radius:10px}
.m-res{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.m-res span{font-size:11.5px;color:var(--ink-2)} .m-res .m-tag{align-self:flex-start}
.m-shield{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--info-bg);transition:background-color .35s,color .35s}
.m-shield .sic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid currentColor;flex:none}
.m-shield.bad{background:var(--crit-bg);color:var(--crit)} .m-shield.good{background:var(--ok-bg);color:var(--ok)}
.m-bin{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center;z-index:3}
.m-bin .bc{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center}
.cl{max-width:440px;width:100%;align-self:center}
.m-toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:var(--r-pill);font-weight:600;white-space:nowrap;display:flex;gap:12px}
.m-toast b{color:var(--cobalt);filter:brightness(1.4)}
.m-ph span{display:block;font-size:11px;color:var(--ink-3)} .m-ph b{font-size:15px}
.m-job{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--raised)}
.m-it{display:flex;gap:6px;align-items:center;font-size:11px;white-space:nowrap}
.m-it .m-tag{font-size:9px;padding:0 4px}
.m-it .m-ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line-strong);transition:background-color .25s}
.m-it.on .m-ck{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--raised)}
.m-it .m-tag{margin-left:auto}
.m-banner{padding:10px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:12px;text-align:center}
.m-adm{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:10px}
.m-adm > .m-panel:last-child{grid-column:1/-1}
.m-dep{display:flex;gap:8px;flex-wrap:wrap}
.m-dcard{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--glacier);font-weight:700}
.m-live{display:inline-flex;gap:6px;align-items:center;font-size:10.5px;color:var(--ok);font-weight:700}
.m-live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:mpulse2 1.2s infinite}
@keyframes mpulse2{50%{opacity:.25}}
.m-logs{display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.m-log{padding:3px 6px;border-radius:5px}
.m-log b{color:var(--ink-3);font-weight:500;margin-right:8px}
.m-log.err{background:var(--crit-bg);color:var(--crit)}
@media (max-width:860px){
  .player{grid-template-columns:1fr}
  .chaps{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scroll-snap-type:x mandatory}
  .chaps li{flex:0 0 auto;scroll-snap-align:start}
  .chap{grid-template-columns:24px auto;padding:7px 10px;white-space:nowrap}
  .chap .cd{display:none}
  .sc-stage{height:330px;padding:14px;font-size:11.5px}
  .m-kpis{grid-template-columns:1fr 1fr}
  .m-kpi:nth-child(n+3){display:none}
  .m-hit + .m-hit{display:none}
  .m-phone{height:298px;width:220px}
  .m-panel{padding:10px 12px;gap:6px}
  .m-row{padding:6px 2px}
  .m-kpi{padding:8px 10px}
  .m-kan{gap:4px}
  .m-col{padding:5px 4px}
  .m-colh{font-size:8.5px;letter-spacing:0}
  .m-colh i{display:none}
  .m-card{padding:5px}
  .m-card b{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-card span{display:none}
  .m-card .m-pill{font-size:9px;padding:1px 5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .m-srow{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}
  .m-srow .m-gauge{grid-column:1/-1}
  .m-drawer{width:auto;left:14px;top:auto;height:56%}
  .m-adm{grid-template-columns:1fr}
  .m-adm > .m-panel:nth-child(2){display:none}
  .tr-prog > div{grid-template-columns:80px 120px auto}
  .tr-prog .meter{width:120px}
}

const SAVE_KEY = 'qs-demo-v7';

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const iso = /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d/;
    const d = JSON.parse(raw, (k, v) => typeof v === 'string' && iso.test(v) ? new Date(v) : v);

    S = d.S; CLIENTS.splice(0, CLIENTS.length, ...d.CLIENTS); ARTICLES.splice(0, ARTICLES.length, ...d.ARTICLES);
    Object.keys(ART).forEach(k => delete ART[k]); ARTICLES.forEach(a => ART[a.id] = a);
    UI.done = d.done || {}; UI.seen = d.seen || {}; UI.tourSeen = !!d.tourSeen; affSeq = d.affSeq || affSeq;
    if (d.mods) UI.mods = d.mods; UI.big = !!d.big; UI.calm = !!d.calm; UI.theme = d.theme || 'auto'; UI.maint = !!d.maint;

/* Corbeille : 30 jours pour récupérer, puis effacement */
const TRASH_DAYS = 30;
const trash = () => (S.trash = S.trash || []);
function purgeTrash() { S.trash = trash().filter(t => (Date.now() - t.date) / DAY < TRASH_DAYS); }
function toTrash(entry) { entry.id = 't' + Date.now() + Math.round(Math.random() * 999); entry.date = new Date(); entry.user = who(); trash().unshift(entry); return entry; }
function restoreTrash(tid) {
  const i = trash().findIndex(t => t.id === tid); if (i < 0) return;
  const t = trash()[i]; trash().splice(i, 1);
  if (t.kind === 'client') { CLIENTS.push(t.obj); (t.affs || []).forEach(a => S.aff.push(a)); }
  if (t.kind === 'affaire') S.aff.push(t.obj);
  if (t.kind === 'article') { ARTICLES.push(t.obj); ART[t.obj.id] = t.obj; }
  if (t.kind === 'depot') { S.depotInfo[t.obj.code] = t.obj.info; ARTICLES.forEach(a => { S.stock[a.id][t.obj.code] = 0; S.enCommande[a.id][t.obj.code] = 0; a.seuil[t.obj.code] = t.obj.seuils[a.id] || 0; }); syncDepots(); }
  track('m4');
  toast(`${t.label} restauré${t.kind === 'affaire' ? 'e' : ''}.`); render();
}
function deleteClient(id) {
  const c = CL(id), affs = S.aff.filter(a => a.client === id);
  if (affs.some(a => !['pose', 'perdu'].includes(a.stage))) return toast('Cette fiche a une affaire en cours. Archivez-la, ou terminez l\u2019affaire avant.');
  CLIENTS.splice(CLIENTS.indexOf(c), 1); affs.forEach(a => S.aff.splice(S.aff.indexOf(a), 1));
  const t = toTrash({kind:'client', obj:c, affs, label: c.nom});
  closeDrawer(); render();
  toast(`${c.nom} est dans la corbeille (30 jours).`, {label:'Annuler', fn: () => restoreTrash(t.id)});
}
function deleteAffaire(id) {
  const a = S.aff.find(x => x.id === id);
  if (a.mat.some(m => m.etat === 'sorti')) return toast('Du matériel est déjà sorti : faites d\u2019abord un retour au dépôt.');
  S.aff.splice(S.aff.indexOf(a), 1);
  const t = toTrash({kind:'affaire', obj:a, label:`Affaire ${a.id}`});
  closeDrawer(); render();
  toast(`Affaire ${a.id} dans la corbeille. Le matériel réservé est libéré.`, {label:'Annuler', fn: () => restoreTrash(t.id)});
}
function deleteArticle(id) {
  const a = ART[id], tot = Object.keys(DEPOTS).reduce((s, d) => s + S.stock[id][d] + reserved(id, d), 0);
  if (tot > 0) return toast('Il reste du stock ou une réservation : archivez l\u2019article plutôt.');
  ARTICLES.splice(ARTICLES.indexOf(a), 1); delete ART[id];
  const t = toTrash({kind:'article', obj:a, label: a.nom});
  closeDrawer(); render();
  toast(`${a.nom} dans la corbeille.`, {label:'Annuler', fn: () => restoreTrash(t.id)});
}
function viewCorbeille() {
  purgeTrash();
  const T = trash();
  const kindIc = {client:'users', affaire:'flag', article:'box', depot:'pin'}, kindT = {client:'Client', affaire:'Affaire', article:'Article', depot:'Dépôt'};
  return `<div class="note">Ce que vous supprimez arrive ici. Vous avez <b>${TRASH_DAYS} jours</b> pour le restaurer, puis il est effacé pour de bon. Pour garder une fiche sans la voir, préférez <b>Archiver</b>.</div>
  <div class="rows">${T.length ? T.map(t => { const left = Math.max(0, TRASH_DAYS - Math.floor((Date.now() - t.date) / DAY)); return `
    <div class="row" data-flip="tr-${t.id}">
      <span class="mv-ic">${ic(kindIc[t.kind], 16)}</span>
      <div style="min-width:0"><div class="t">${esc(t.label)} <span class="pill plain">${kindT[t.kind]}</span></div><div class="s">Supprimé ${relTime(t.date)} par ${esc(t.user)} · effacement dans ${left} jour${left > 1 ? 's' : ''}${t.affs && t.affs.length ? ` · avec ${t.affs.length} affaire${t.affs.length > 1 ? 's' : ''}` : ''}</div></div>
      <div class="btnrow"><button class="btn sm" data-restore="${t.id}">${ic('restore', 15)} Restaurer</button><button class="btn sm ghost danger" data-purge="${t.id}">Effacer</button></div>
    </div>`; }).join('') : `<div class="empty">${ic('trash', 28)}<p><b>La corbeille est vide.</b><br>Ce que vous supprimez y reste ${TRASH_DAYS} jours.</p></div>`}</div>`;
}

/* ================== Calculs ================== */
const clientName = a => a.client ? CL(a.client).nom : (a.contact ? a.contact.nom : '—');
const clientVille = a => a.client ? CL(a.client).ville : (a.contact ? (/^\d/.test(a.contact.ville) ? 'CP ' + a.contact.ville : a.contact.ville) : '');
const planned = () => S.aff.filter(c => c.stage === 'planifie');
const reserved = (art, depot) => planned().filter(c => c.depot === depot).reduce((s, c) => s + c.mat.filter(m => m.art === art && m.etat === 'réservé').reduce((t, m) => t + m.qte, 0), 0);
const dispo = (art, depot) => S.stock[art][depot] - reserved(art, depot);
function etat(art, depot) {
  const q = S.stock[art][depot], r = reserved(art, depot), a = ART[art], cmd = S.enCommande[art][depot];
  if (r > q) return cmd ? {k:'info', t:'En commande', rank:2} : {k:'crit', t:'Réservation non couverte', rank:0};
  if (q === 0) return cmd ? {k:'info', t:'En commande', rank:2} : {k:'crit', t:'Rupture', rank:1};
  if (q - r < a.seuil[depot]) return cmd ? {k:'info', t:'En commande', rank:3} : {k:'warn', t:'Sous le seuil', rank:2};
  return {k:'ok', t:'Disponible', rank:4};
}
function worst(art, depots) { return depots.map(d => etat(art, d)).sort((x, y) => x.rank - y.rank)[0]; }
const visibleDepots = () => UI.role === 'responsable' ? [UI.depot] : Object.keys(DEPOTS);
const stockValue = d => ARTICLES.reduce((s, a) => s + S.stock[a.id][d] * a.prix, 0);
function alerts(depots = visibleDepots()) {
  const out = [];
  for (const a of liveArts()) for (const d of depots) { const e = etat(a.id, d); if (e.k !== 'ok') out.push({a, d, e}); }
  return out.sort((x, y) => x.e.rank - y.e.rank);
}
const toOrder = (depots = visibleDepots()) => alerts(depots).filter(x => x.e.k === 'crit' || x.e.k === 'warn');
const showPrices = () => can('prices');
const lastContact = a => Math.max(a.devisDate ? a.devisDate.getTime() : 0, a.relance ? a.relance.getTime() : 0);
const aRelancer = a => a.stage === 'devis' && (Date.now() - lastContact(a)) / DAY >= 7;
function chantierManque(c) { return c.mat.filter(m => m.etat === 'réservé' && reserved(m.art, c.depot) > S.stock[m.art][c.depot]); }
function entretienDue(p) {
  const art = ART[p.art], kw = art.kw || 0;
  return {date: new Date(p.date.getTime() + 730 * DAY), obligatoire: kw >= 4};
}
function entretiensAProposer(depots = visibleDepots(), within = 60) {
  const out = [];
  for (const c of S.aff.filter(a => a.stage === 'pose' && depots.includes(a.depot))) {
    if (S.aff.some(x => x.type === 'entretien' && x.client === c.client && x.stage !== 'perdu' && x.stage !== 'pose')) continue;
    const main = c.poses.find(p => ['UE','MX'].includes(ART[p.art].cat)) || c.poses[0];
    if (!main) continue;
    const e = entretienDue(main);
    if (dayDiff(e.date) <= within) out.push({c, e, main});
  }
  return out.sort((x, y) => x.e.date - y.e.date);
}

/* Kit de pose proposé à partir des puissances par pièce */
function kitFor(kws, marque) {
  const pick = (cat, kw, brand) => {
    const list = liveArts().filter(a => a.cat === cat && a.marque === brand && a.kw).sort((x, y) => x.kw - y.kw);
    return list.find(a => a.kw >= kw) || null;
  };
  const brand = marque || 'Mitsubishi Electric';
  const lines = [];
  const add = (art, qte) => { if (!art) return; const l = lines.find(x => x.art === art); l ? l.qte += qte : lines.push({art, qte}); };
  if (!kws.length) return lines;
  if (kws.length === 1) {
    const kw = kws[0];
    const ui = pick('UI', kw, brand) || pick('UI', kw, 'Mitsubishi Electric'), ue = pick('UE', kw, brand) || pick('UE', kw, 'Mitsubishi Electric');
    add(ui && ui.id, 1); add(ue && ue.id, 1); add('a14', 1); add('a18', 1);
  } else {
    const total = kws.reduce((s, k) => s + k, 0);
    const mx = ARTICLES.filter(a => a.cat === 'MX' && (a.marque === brand || a.marque === 'Mitsubishi Electric') && a.nom.includes(kws.length + ' sorties') && a.kw >= total).sort((x, y) => (x.marque === brand ? 0 : 1) - (y.marque === brand ? 0 : 1))[0];
    add(mx ? mx.id : (kws.length === 2 ? 'a11' : 'a12'), 1);
    for (const kw of kws) { const ui = pick('UI', kw, brand) || pick('UI', kw, 'Mitsubishi Electric'); add(ui && ui.id, 1); }
    add('a18', kws.length); add('a16', kws.length * 2); add('a17', 1);
  }
  return lines;
}

    v.querySelectorAll('.bars .col i').forEach((el, i) => anim(el, [{transform: 'scaleY(0)'}, {transform: 'scaleY(1)'}], {duration: 760, delay: 260 + i * 40, easing: SPRING}));

/* ---------- Graphiques (SVG, couleurs du thème, tracés animés) ---------- */
const scaleNice = max => { const p = Math.pow(10, Math.floor(Math.log10(max || 1))); const n = Math.ceil(max / p); return (n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
function sparkline(vals, label) {
  const w = 132, h = 40, pad = 4, mx = Math.max(...vals), mn = Math.min(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [pad + i * (w - pad * 2) / (vals.length - 1), h - pad - (v - mn) / rg * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}"><path class="ar" d="${d} L${last[0]} ${h} L${pts[0][0]} ${h} Z" fill="var(--c1)" opacity=".1"/><path class="ln" d="${d}" pathLength="1" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="dot-end" cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--c1)" stroke="var(--raised)" stroke-width="2"/></svg>`;
}
function series(end, n, spread, seedK) {
  const out = []; let x = seedK;
  for (let i = 0; i < n; i++) { x = (x * 9301 + 49297) % 233280; out.push(end * (1 - spread + spread * (i / (n - 1)) + ((x / 233280) - .5) * spread * .6)); }
  out[n - 1] = end; return out;
}
function kpiCard(o) {
  return `<button class="kpi2" ${o.go ? `data-go="${o.go}"` : `data-act="${o.act}"`}>
    <span class="kpi2-h"><span class="chip ${o.tone || ''}">${ic(o.ic, 16)}</span><span class="lbl">${o.lbl}</span></span>
    <span class="kpi2-v"><span data-count="${o.v}" data-v="${o.key}">${nf.format(o.v)}</span>${o.unit ? `<small>${o.unit}</small>` : ''}</span>
    <span class="kpi2-f"><span class="kpi2-d">${o.d}</span>${o.spark ? sparkline(o.spark, o.lbl + ', 12 dernières semaines') : ''}</span>
  </button>`;
}
function panelHead(icn, title, why, link) {
